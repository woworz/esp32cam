<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32-S3 CAM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101416;color:#eef2f1;font-family:Arial,"Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column}
header{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30383a;background:#171c1e}
.brand{font-size:18px;font-weight:700}
.state{display:flex;align-items:center;gap:8px;color:#aeb8b6;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#e66b55}.dot.ok{background:#48b899}
main{width:min(100%,1080px);margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
.viewer{min-width:0;background:#050606;border:1px solid #30383a;border-radius:6px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.viewer img{display:block;width:100%;height:100%;object-fit:contain}
.panel{display:flex;flex-direction:column;gap:16px;padding:16px;border-left:1px solid #30383a}
.panel h1{font-size:16px;margin:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;font-size:13px}
.meta dt{color:#8e9a98}.meta dd{margin:0;text-align:right;overflow-wrap:anywhere}
.actions{display:grid;gap:10px}
button,a.action{min-height:44px;border:1px solid #3c4849;border-radius:6px;background:#242b2d;color:#f4f7f6;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;text-decoration:none;display:flex;align-items:center;justify-content:center;transition:filter .18s ease,border-color .18s ease}
button.primary{background:#d65f4d;border-color:#d65f4d}
button:hover,a.action:hover{filter:brightness(1.12)}button:disabled{opacity:.55;cursor:wait}
button:focus-visible,a.action:focus-visible{outline:3px solid #48b899;outline-offset:2px}
#message{min-height:38px;margin:0;padding:10px;background:#1b2123;border-left:3px solid #48b899;color:#bdc7c5;font-size:12px;line-height:1.5}
footer{padding:12px 16px;text-align:center;color:#73807e;font-size:11px}
@media(max-width:720px){
 header{height:52px}.brand{font-size:16px}
 main{padding:10px;display:block}.viewer{width:100%}
 .panel{border-left:0;border-top:1px solid #30383a;padding:16px 4px 4px;margin-top:12px}
 .actions{grid-template-columns:1fr 1fr}button.primary{grid-column:1/-1}
}
</style>
</head>
<body>
<header>
  <div class="brand">ESP32-S3 CAM</div>
  <div class="state"><span id="dot" class="dot"></span><span id="state" aria-live="polite">连接中</span></div>
</header>
<main>
  <section class="viewer" aria-label="摄像头实时画面">
    <img id="stream" src="/stream" alt="摄像头实时画面">
  </section>
  <aside class="panel">
    <h1>设备控制</h1>
    <dl class="meta">
      <dt>设备地址</dt><dd id="host">-</dd>
      <dt>分辨率</dt><dd>400 x 296</dd>
      <dt>传感器</dt><dd>OV3660</dd>
      <dt>显示屏</dt><dd>ST7789</dd>
    </dl>
    <div class="actions">
      <button id="capture" class="primary" type="button">拍照</button>
      <button id="reload" type="button">重连画面</button>
      <a class="action" href="/stream" target="_blank">单独打开</a>
    </div>
    <p id="message" aria-live="polite">正在读取设备状态...</p>
  </aside>
</main>
<footer>本页面由 ESP32-S3 本机提供</footer>
<script>
const stream=document.getElementById("stream");
const capture=document.getElementById("capture");
const message=document.getElementById("message");
const dot=document.getElementById("dot");
const state=document.getElementById("state");
document.getElementById("host").textContent=location.host;
function setState(ok,text){dot.className=ok?"dot ok":"dot";state.textContent=text}
async function refreshStatus(){
  try{
    const response=await fetch("/wifi_status",{cache:"no-store"});
    const data=await response.json();
    const ok=Boolean(data.connected);
    setState(ok,ok?"在线":"网络异常");
    if(ok)message.textContent="设备工作正常，点击拍照可保存并上传当前画面。";
  }catch(error){
    setState(false,"连接失败");message.textContent="无法读取设备状态。";
  }
}
capture.addEventListener("click",async()=>{
  const oldLabel=capture.textContent;
  capture.disabled=true;capture.textContent="拍照中...";message.textContent="正在触发拍照...";
  try{
    const response=await fetch("/capture",{cache:"no-store"});
    const data=await response.json();
    message.textContent=data.message||"拍照任务已触发。";
  }catch(error){
    message.textContent="拍照请求失败，请检查设备连接。";
  }finally{capture.disabled=false;capture.textContent=oldLabel}
});
document.getElementById("reload").addEventListener("click",()=>{
  stream.src="";
  setTimeout(()=>{stream.src="/stream?t="+Date.now()},150);
  message.textContent="正在重新连接实时画面...";
});
stream.addEventListener("load",()=>setState(true,"在线"));
stream.addEventListener("error",()=>{
  setState(false,"画面断开");message.textContent="实时画面已断开，请点击“重连画面”。";
});
refreshStatus();
setInterval(refreshStatus,10000);
</script>
</body>
</html>
